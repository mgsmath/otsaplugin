<!DOCTYPE html>
<html dir="rtl" lang="he">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>תרגום אנגלית</title>
    <link rel="stylesheet" href="css/plugin.css" />
  </head>
  <body>
    <div id="root">
      <div class="app-shell">
        <header class="topbar">
          <div class="brand">
            <h1>תרגום אנגלית</h1>
            <span class="subtitle" id="bar-subtitle"></span>
          </div>
          <span class="bar-title" id="bar-title"></span>
          <div class="topbar-actions">
            <button type="button" class="icon-btn" id="btn-reader" title="פתח בקורא">
              <span aria-hidden="true">↗</span>
            </button>
            <button type="button" class="icon-btn" id="btn-follow" aria-pressed="false">
              עקוב אחרי הקורא
            </button>
            <button type="button" class="icon-btn" id="btn-options" title="הגדרות">
              <span aria-hidden="true">⚙</span>
            </button>
            <button type="button" class="icon-btn" id="btn-credits" title="קרדיטים ורשיונות">
              <span aria-hidden="true">©</span>
            </button>
          </div>
        </header>

        <nav class="view-tabs" id="view-tabs" aria-label="תצוגות"></nav>

        <main class="app-content" id="app-content">
          <div id="notice" class="notice-host"></div>
          <div id="status" class="status hidden"></div>
          <div id="render-host"></div>
        </main>
      </div>

      <div class="scrim" id="scrim"></div>

      <aside class="panel" id="panel-options" aria-label="הגדרות">
        <div class="panel-head">
          <h2>הגדרות</h2>
          <button type="button" class="icon-btn" id="panel-close" title="סגור">
            <span aria-hidden="true">✕</span>
          </button>
        </div>
        <div class="panel-body">
          <label class="row">
            <input type="checkbox" id="opt-numbers" />
            <span>הצג מספרי פסוקים / שורות</span>
          </label>
          <label class="row">
            <input type="checkbox" id="opt-credit" />
            <span>הצג שורת מקור ורשיון</span>
          </label>
          <label class="row">
            <span>סדר עמודות</span>
            <select id="opt-order">
              <option value="hebrew-first">עברית מימין</option>
              <option value="english-first">אנגלית מימין</option>
            </select>
          </label>
          <label class="row">
            <span>מקור העברית</span>
            <select id="opt-hebrew">
              <option value="otzaria">הטקסט של אוצריא</option>
              <option value="sefaria">ספריא (מנורמל)</option>
            </select>
          </label>
          <label class="row">
            <span>הקשר בהצצה (± קטעים)</span>
            <select id="opt-context">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="5">5</option>
            </select>
          </label>
          <div class="row stack">
            <span>מקור הנתונים</span>
            <div class="btn-row">
              <button type="button" class="btn" id="opt-import">בחר קובץ ‎.otzenpack</button>
              <button type="button" class="btn" id="opt-bundled">חזור לחבילה המובנית</button>
            </div>
            <p class="note" id="pack-info"></p>
          </div>
          <p class="note">
            התוסף אינו מבצע שום פנייה לרשת. כל הטקסט נמצא בקובץ ההתקנה או בקובץ שבחרת.
          </p>
        </div>
      </aside>

      <aside class="panel" id="panel-credits" aria-label="קרדיטים ורשיונות">
        <div class="panel-head">
          <h2>קרדיטים ורשיונות</h2>
          <button type="button" class="icon-btn" id="panel-close-2" title="סגור">
            <span aria-hidden="true">✕</span>
          </button>
        </div>
        <div class="panel-body" id="credits-body"></div>
      </aside>
    </div>

    <script src="js/env.js"></script>
    <script src="js/sanitize.js"></script>
    <script src="js/refmap.js"></script>
    <script src="js/align.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="i18n/en.js"></script>
    <script src="js/views.js"></script>
    <script src="js/credits.js"></script>
    <script src="js/app.js"></script>
    <script>
      window.OtzEn.App.start();
    </script>
  </body>
</html>
