<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English for Otzaria</title>
    <link rel="stylesheet" href="css/plugin.css" />
  </head>
  <body>
    <div id="root">
      <div class="app-shell">
        <header class="topbar">
          <div class="brand">
            <h1>English translations</h1>
            <span class="subtitle" id="bar-subtitle"></span>
          </div>
          <span class="bar-title" id="bar-title"></span>
          <div class="topbar-actions">
            <button type="button" class="icon-btn" id="btn-translate" title="Translate the current reader location">
              Translate
            </button>
            <button type="button" class="icon-btn" id="btn-split" title="Show Hebrew and English side by side" aria-pressed="false">
              Split view
            </button>
            <button type="button" class="icon-btn" id="btn-reader" title="Open this text in the reader">
              Reader
            </button>
            <button type="button" class="icon-btn" id="btn-follow" aria-pressed="false" title="Keep this panel in sync with the reader">
              Follow reader
            </button>
            <button type="button" class="icon-btn" id="btn-options" title="Settings" aria-label="Settings">
              <span aria-hidden="true">⚙</span>
            </button>
          </div>
        </header>

        <nav class="view-tabs" id="view-tabs" aria-label="Translation views"></nav>

        <main class="app-content" id="app-content">
          <div id="notice" class="notice-host"></div>
          <div id="status" class="status hidden"></div>
          <div id="render-host"></div>
        </main>
      </div>

      <div class="scrim" id="scrim"></div>

      <aside class="panel" id="panel-options" aria-label="Settings">
        <div class="panel-head">
          <h2>Settings</h2>
          <button type="button" class="icon-btn" id="panel-close" title="Close settings" aria-label="Close settings">
            <span aria-hidden="true">✕</span>
          </button>
        </div>
        <div class="panel-body">
          <label class="row">
            <input type="checkbox" id="opt-numbers" />
            <span>Show verse and line numbers</span>
          </label>
          <label class="row">
            <span>Side-by-side order</span>
            <select id="opt-order">
              <option value="hebrew-first">Hebrew on the right</option>
              <option value="english-first">English on the right</option>
            </select>
          </label>
          <label class="row">
            <span>Peek context (passages)</span>
            <select id="opt-context">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="5">5</option>
            </select>
          </label>
          <div class="row stack">
            <span>Translation data</span>
            <div class="btn-row">
              <button type="button" class="btn" id="opt-import">Load an extended .otzenpack library</button>
              <button type="button" class="btn" id="opt-bundled">Use the built-in library</button>
            </div>
            <p class="note" id="pack-info"></p>
          </div>
          <p class="note">
            Use the Split view button for Hebrew and English in this panel. To place the plugin in a separate Otzaria split pane, use the tab menu and choose “Show side by side.”
          </p>
        </div>
      </aside>
    </div>

    <script src="js/env.js"></script>
    <script src="js/sanitize.js"></script>
    <script src="js/refmap.js"></script>
    <script src="js/align.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="i18n/en.js"></script>
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
    <script>
      window.OtzEn.App.start();
    </script>
  </body>
</html>
